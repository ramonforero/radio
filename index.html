<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LA RADIOESTACIÓN 24/7 - La radio que te acompaña</title>
  <style>
    :root {
      --bg-page: radial-gradient(circle at top, #122d63, #050c1a);
      --bg-dark: #071329;
      --card-bg: #0c1f44;
      --surface-soft: rgba(7, 19, 41, 0.72);
      --surface-btn: rgba(255, 255, 255, 0.08);
      --surface-btn-hover: rgba(255, 255, 255, 0.16);
      --accent: #fbbf24;
      --accent-hover: #f59e0b;
      --accent-text: #071329;
      --title-color: #fbbf24;
      --whatsapp: #25d366;
      --whatsapp-text: #051b0e;
      --text-main: #ffffff;
      --text-muted: #cbd5e1;
      --border: rgba(255, 255, 255, 0.12);
      --shadow-card: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    body.light-theme {
      --bg-page: radial-gradient(circle at top, #e0f2fe, #cbd5e1);
      --bg-dark: #f1f5f9;
      --card-bg: #ffffff;
      --surface-soft: #f8fafc;
      --surface-btn: #f1f5f9;
      --surface-btn-hover: #e2e8f0;
      --accent: #1d4ed8;
      --accent-hover: #1e40af;
      --accent-text: #ffffff;
      --title-color: #0f172a;
      --whatsapp: #16a34a;
      --whatsapp-text: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border: rgba(15, 23, 42, 0.12);
      --shadow-card: 0 20px 45px rgba(15, 23, 42, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: background 0.35s ease, color 0.35s ease;
    }

    .player-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border);
      text-align: center;
      position: relative;
      transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .theme-toggle-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: var(--surface-btn);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 20px;
      padding: 6px 11px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s, transform 0.15s;
      z-index: 10;
    }

    .theme-toggle-btn:hover {
      background: var(--surface-btn-hover);
      transform: scale(1.04);
    }

    .logo-wrapper {
      width: 165px;
      height: 165px;
      margin: 8px auto 14px;
      border-radius: 22px;
      overflow: hidden;
      border: 3px solid var(--accent);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .logo-wrapper img.is-logo {
      object-fit: contain;
    }

    .equalizer-container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      height: 28px;
      margin: 0 auto 12px;
      padding: 4px 12px;
      background: var(--surface-soft);
      border-radius: 12px;
      border: 1px solid var(--border);
      width: fit-content;
    }

    .eq-bar {
      width: 4px;
      height: 4px;
      border-radius: 3px;
      background: linear-gradient(to top, #38bdf8, #22c55e, #fbbf24, #ef4444);
      transition: height 0.2s ease;
    }

    .equalizer-container.playing .eq-bar {
      animation: eqBounce 0.85s ease-in-out infinite alternate;
    }

    .equalizer-container.playing .eq-bar:nth-child(1) { animation-duration: 0.65s; animation-delay: 0.1s; }
    .equalizer-container.playing .eq-bar:nth-child(2) { animation-duration: 0.85s; animation-delay: 0.3s; }
    .equalizer-container.playing .eq-bar:nth-child(3) { animation-duration: 0.55s; animation-delay: 0.0s; }
    .equalizer-container.playing .eq-bar:nth-child(4) { animation-duration: 0.90s; animation-delay: 0.4s; }
    .equalizer-container.playing .eq-bar:nth-child(5) { animation-duration: 0.60s; animation-delay: 0.2s; }
    .equalizer-container.playing .eq-bar:nth-child(6) { animation-duration: 0.78s; animation-delay: 0.5s; }
    .equalizer-container.playing .eq-bar:nth-child(7) { animation-duration: 0.62s; animation-delay: 0.15s; }
    .equalizer-container.playing .eq-bar:nth-child(8) { animation-duration: 0.88s; animation-delay: 0.35s; }
    .equalizer-container.playing .eq-bar:nth-child(9) { animation-duration: 0.58s; animation-delay: 0.25s; }
    .equalizer-container.playing .eq-bar:nth-child(10) { animation-duration: 0.75s; animation-delay: 0.05s; }
    .equalizer-container.playing .eq-bar:nth-child(11) { animation-duration: 0.68s; animation-delay: 0.45s; }
    .equalizer-container.playing .eq-bar:nth-child(12) { animation-duration: 0.82s; animation-delay: 0.2s; }

    @keyframes eqBounce {
      0% { height: 4px; }
      50% { height: 14px; }
      100% { height: 20px; }
    }

    h1 {
      font-size: 1.45rem;
      letter-spacing: 0.8px;
      font-weight: 800;
      color: var(--title-color);
    }

    .slogan {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 16px;
    }

    .stream-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--bg-dark);
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
    }

    .stream-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 9px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .stream-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    .now-playing-btn {
      width: 100%;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      color: var(--text-main);
      cursor: pointer;
      text-align: left;
      transition: border-color 0.2s, background 0.35s;
    }

    .now-playing-btn:hover {
      border-color: var(--accent);
    }

    .now-playing-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .song-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .action-btn {
      background: var(--surface-btn);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .action-btn:hover {
      background: var(--surface-btn-hover);
    }

    .metadata-drawer {
      display: none;
      background: var(--bg-dark);
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      text-align: left;
      font-size: 0.82rem;
      border: 1px solid var(--border);
    }

    .metadata-drawer.open {
      display: block;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
    }

    .meta-row:last-child {
      border-bottom: none;
    }

    .meta-key {
      color: var(--text-muted);
    }

    .meta-val {
      font-weight: 600;
      text-align: right;
      max-width: 60%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .controls {
      margin: 22px 0 16px;
    }

    .play-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 1.6rem;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(29, 78, 216, 0.3);
      transition: transform 0.15s, background 0.2s;
    }

    .play-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.06);
    }

    .volume-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding: 0 12px;
    }

    .volume-box input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .whatsapp-btn {
      display: block;
      background: var(--whatsapp);
      color: var(--whatsapp-text);
      text-decoration: none;
      font-weight: 700;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.92rem;
      margin-bottom: 20px;
      transition: opacity 0.2s;
    }

    .whatsapp-btn:hover {
      opacity: 0.92;
    }

    .history-box {
      background: var(--surface-soft);
      border-radius: 14px;
      padding: 14px;
      text-align: left;
      border: 1px solid var(--border);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .history-title {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--accent);
    }

    .clear-history-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.72rem;
      padding: 3px 8px;
