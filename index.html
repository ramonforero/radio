  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #0f2954 0%, #061124 100%);
      --card-bg: rgba(11, 28, 56, 0.9);
      --box-bg: rgba(6, 17, 36, 0.68);
      --box-hover: rgba(14, 34, 68, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --card-border: rgba(245, 158, 11, 0.3);
      --accent-gold: #f59e0b;
      --accent-blue: #0ea5e9;
      --accent-red: #ef4444;
      --accent-green: #22c55e;
      --text-main: #ffffff;
      --text-muted: #cbd5e1;
      --title-gradient: linear-gradient(90deg, #ffffff, #fde68a);
      --blur-brightness: 0.3;
    }

    body.light-theme {
      --bg-gradient: radial-gradient(circle at top, #e0f2fe 0%, #f8fafc 100%);
      --card-bg: rgba(255, 255, 255, 0.94);
      --box-bg: rgba(241, 245, 249, 0.92);
      --box-hover: rgba(226, 232, 240, 0.95);
      --border-subtle: rgba(15, 23, 42, 0.1);
      --card-border: rgba(14, 165, 233, 0.35);
      --accent-gold: #d97706;
      --accent-blue: #0284c7;
      --text-main: #0f172a;
      --text-muted: #475569;
      --title-gradient: linear-gradient(90deg, #0f2954, #0284c7);
      --blur-brightness: 0.85;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      color: var(--text-main);
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      transition: background 0.35s ease, color 0.35s ease;
    }

    .bg-blur {
      position: fixed;
      inset: -25px;
      background-size: cover;
      background-position: center;
      filter: blur(32px) brightness(var(--blur-brightness));
      z-index: 0;
      transition: background-image 0.8s ease, filter 0.35s ease;
    }

    .player-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 26px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.32);
      transition: background 0.35s ease, border-color 0.35s ease;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 6px;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #fef3c7;
      background: rgba(239, 68, 68, 0.85);
      padding: 5px 10px;
      border-radius: 999px;
    }

    .listeners-badge {
      display: none;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-main);
      background: var(--box-bg);
      border: 1px solid var(--border-subtle);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .listeners-badge.visible {
      display: inline-flex;
    }

    .badge-247 {
      font-size: 11px;
      font-weight: 800;
      color: #061124;
      background: #f59e0b;
      padding: 5px 10px;
      border-radius: 999px;
    }

    .theme-btn {
      background: var(--box-bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .theme-btn:hover {
      transform: scale(1.08);
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #ffffff;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.25); }
    }

    .cover-wrapper {
      width: 195px;
      height: 195px;
      margin: 0 auto 14px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      background: #ffffff;
      border: 3px solid rgba(245, 158, 11, 0.5);
      padding: 4px;
    }

    .cover-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 14px;
      transition: transform 0.4s ease;
    }

    .cover-wrapper img.album-art {
      object-fit: cover;
    }

    h1 {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 4px;
      background: var(--title-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .slogan {
      font-size: 12px;
      color: var(--accent-blue);
      font-weight: 600;
      margin-bottom: 14px;
    }

    .stream-selector {
      display: inline-flex;
      background: var(--box-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 3px;
      margin-bottom: 14px;
      gap: 4px;
    }

    .stream-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .stream-btn.active {
      background: var(--accent-blue);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(14, 165, 233, 0.4);
    }

    .now-playing-btn {
      width: 100%;
      background: var(--box-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 10px;
      cursor: pointer;
      text-align: center;
      color: inherit;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .now-playing-btn:hover {
      background: var(--box-hover);
      border-color: rgba(245, 158, 11, 0.4);
    }

    .now-playing-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .now-playing-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-gold);
      font-weight: 700;
    }

    .meta-hint {
      font-size: 10px;
      color: var(--accent-blue);
      font-weight: 700;
    }

    .song-title {
      font-size: 14px;
      color: var(--text-main);
      font-weight: 600;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.35;
    }

    /* Botones de acción (Copiar y Compartir) */
    .action-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .action-btn {
      flex: 1;
      background: var(--box-bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-size: 11px;
      font-weight: 700;
      padding: 7px 10px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: var(--box-hover);
      border-color: var(--accent-blue);
    }

    .action-btn.success {
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    /* Botón directo de WhatsApp */
    .whatsapp-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, #25d366, #16a34a);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(37, 211, 102, 0.28);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .whatsapp-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .whatsapp-btn:active {
      transform: scale(0.98);
    }

    /* Panel desplegable de metadatos */
    .metadata-drawer {
      display: none;
      background: var(--box-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 16px;
      text-align: left;
      font-size: 12px;
    }

    .metadata-drawer.open {
      display: block;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .meta-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .meta-key {
      color: var(--text-muted);
      font-weight: 600;
      flex-shrink: 0;
    }

    .meta-val {
      color: var(--text-main);
      font-weight: 600;
      text-align: right;
      word-break: break-word;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #061124;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .play-btn:hover { transform: scale(1.06); filter: brightness(1.08); }
    .play-btn:active { transform: scale(0.96); }

    .volume-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      justify-content: center;
    }

    input[type="range"] {
      accent-color: #f59e0b;
      width: 140px;
      cursor: pointer;
    }

    .history-box {
      margin-top: 16px;
      background: var(--box-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px 14px;
      text-align: left;
    }

    .history-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-blue);
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 135px;
      overflow-y: auto;
    }

    .history-list::-webkit-scrollbar {
      width: 4px;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: rgba(245, 158, 11, 0.35);
      border-radius: 4px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .history-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .history-song {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .history-time {
      font-size: 10px;
      color: var(--accent-gold);
      font-weight: 600;
      flex-shrink: 0;
    }

    .history-empty {
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
      text-align: center;
      padding: 4px 0;
    }

    .footer-tags {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
  </style>
</head>

    // ==========================================
    // COPIAR TEMA AL PORTAPAPELES
    // ==========================================
    function copyTextToClipboard(text, buttonEl, successLabel, defaultLabel) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showCopyFeedback(buttonEl, successLabel, defaultLabel)).catch(() => fallbackCopy(text, buttonEl, successLabel, defaultLabel));
      } else {
        fallbackCopy(text, buttonEl, successLabel, defaultLabel);
      }
    }

    function fallbackCopy(text, buttonEl, successLabel, defaultLabel) {
      const tempInput = document.createElement("textarea");
      tempInput.value = text;
      tempInput.style.position = "fixed";
      tempInput.style.opacity = "0";
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand("copy");
        showCopyFeedback(buttonEl, successLabel, defaultLabel);
      } catch (err) {}
      document.body.removeChild(tempInput);
    }

    function showCopyFeedback(buttonEl, successLabel, defaultLabel) {
      buttonEl.classList.add("success");
      buttonEl.textContent = successLabel;
      setTimeout(() => {
        buttonEl.classList.remove("success");
        buttonEl.textContent = defaultLabel;
      }, 2200);
    }

    copySongBtn.addEventListener("click", () => {
      const textToCopy = currentSong || "La Radioestación 24/7 - La radio que te acompaña";
      copyTextToClipboard(textToCopy, copySongBtn, "✅ ¡Copiado!", "📋 Copiar tema");
    });

    shareBtn.addEventListener("click", async () => {

      const songText = currentSong ? `Ahora suena: "${currentSong}"` : "La radio que te acompaña";
      const shareText = `🎧 Escucha La Radioestación 24/7 en vivo — ${songText}`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: "La Radioestación 24/7",
            text: shareText,
            url: stationUrl
          });
          return;
        } catch (err) {
          if (err.name === "AbortError") return;
        }
      }

      copyTextToClipboard(`${shareText} 👉 ${stationUrl}`, shareBtn, "✅ ¡Enlace copiado!", "📤 Compartir");
    });

    function applyTheme(theme) {
      const isLight = theme === "light";
      document.body.classList.toggle("light-theme", isLight);
      themeToggleBtn.textContent = isLight ? "🌙" : "☀️";
      themeToggleBtn.title = isLight ? "Cambiar a fondo oscuro" : "Cambiar a fondo blanco";
    }

    const savedTheme = localStorage.getItem("radioestacion_theme") || "dark";
    applyTheme(savedTheme);

    themeToggleBtn.addEventListener("click", () => {
      const nextTheme = document.body.classList.contains("light-theme") ? "dark" : "light";
      localStorage.setItem("radioestacion_theme", nextTheme);
      applyTheme(nextTheme);
    });

    // ==========================================

    function updateListeners(count) {
      const num = Number(count);
      if (!Number.isNaN(num) && num >= 0) {
        listenersCountEl.textContent = num;
        listenersBadge.classList.add("visible");
        metaListenersEl.textContent = `${num} conectados`;
      } else {
        listenersBadge.classList.remove("visible");
        metaListenersEl.textContent = "No disponible";
      }
    }

    // ==========================================

    function setCover(url, isLogo = false) {
      coverImg.src = url;
      coverImg.classList.toggle("album-art", !isLogo);
      bgBlur.style.backgroundImage = `url('${url}')`;
    }

    // ==========================================
    // CAMBIO ENTRE SEÑAL 1 Y SEÑAL 2
    // ==========================================
    function selectStream(index, autoPlay = false) {
      if (activeStreamIndex === index && !autoPlay) return;
      activeStreamIndex = index;
      btnStream1.classList.toggle("active", index === 0);
      btnStream2.classList.toggle("active", index === 1);

      const stream = CONFIG.streams[index];
      metaStreamEl.textContent = `${stream.name} (${stream.provider})`;
      metaQualityEl.textContent = "En vivo";
      updateListeners(null);
      startMetadataListener();

      if (isPlaying || autoPlay) {
        startPlayback(false);
      }
    }

    btnStream1.addEventListener("click", () => selectStream(0));
    btnStream2.addEventListener("click", () => selectStream(1));

    // ==========================================
    // CONTROL DE AUDIO Y RESPALDO AUTOMÁTICO
    // ==========================================
    audio.volume = volumeSlider.value;

    function startPlayback(allowFallback = true) {
      const selectedStream = CONFIG.streams[activeStreamIndex];
      const separator = selectedStream.url.includes("?") ? "&" : "?";
      audio.src = `${selectedStream.url}${separator}t=${Date.now()}`;

      audio.play()
        .then(() => {
          isPlaying = true;
          playBtn.textContent = "⏸";
        })
        .catch(() => {
          if (allowFallback && CONFIG.streams.length > 1) {
            const fallbackIndex = activeStreamIndex === 0 ? 1 : 0;
            selectStream(fallbackIndex, true);
          } else {
            isPlaying = false;
            playBtn.textContent = "▶";
            songTitleEl.textContent = "Error al conectar. Toca ▶ de nuevo.";
          }
        });
    }

    playBtn.addEventListener("click", () => {
      if (!isPlaying) {
        startPlayback(true);
      } else {
        audio.pause();
        audio.src = "";
        isPlaying = false;
        playBtn.textContent = "▶";
      }
    });

    // ==========================================
    function addToHistory(songName) {
      if (!songName) return;
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      if (songHistory.length > 0 && songHistory[0].title === songName) return;

      songHistory.unshift({ title: songName, time: timeStr });

      if (songHistory.length > CONFIG.maxHistory) {
        songHistory.pop();
      }

      renderHistory();
    }

    function renderHistory() {
      if (songHistory.length === 0) {
        historyListEl.innerHTML = `<li class="history-empty">Aún no hay canciones anteriores registradas</li>`;
        return;
      }

      historyListEl.innerHTML = "";
      songHistory.forEach((item) => {
        const li = document.createElement("li");
        li.className = "history-item";

        const titleSpan = document.createElement("span");
        titleSpan.className = "history-song";
        titleSpan.textContent = item.title;
        titleSpan.title = item.title;

        const timeSpan = document.createElement("span");
        timeSpan.className = "history-time";
        timeSpan.textContent = item.time;

        li.appendChild(titleSpan);
        li.appendChild(timeSpan);
        historyListEl.appendChild(li);
      });
    }

    // ==========================================
    // PARSEO Y CARÁTULA DESDE ITUNES
    // ==========================================
    function parseArtistAndTrack(fullTitle) {
      const parts = fullTitle.split(" - ");
      if (parts.length >= 2) {
        return {
          artist: parts[0].trim(),
          track: parts.slice(1).join(" - ").trim()
        };
      }
      return {
        artist: "La Radioestación 24/7",
        track: fullTitle
      };
    }

    async function fetchArtworkAndDetails(songQuery) {
      const parsed = parseArtistAndTrack(songQuery);
      metaArtistEl.textContent = parsed.artist;
      metaTrackEl.textContent = parsed.track;
      metaAlbumEl.textContent = "Transmisión en vivo";

      try {
        const response = await fetch(
          `https://itunes.apple.com/search?term=${encodeURIComponent(songQuery)}&media=music&limit=1`
        );
        const data = await response.json();
        if (data.results && data.results.length > 0) {
          const hit = data.results[0];
          if (hit.trackName) metaTrackEl.textContent = hit.trackName;
          if (hit.artistName) metaArtistEl.textContent = hit.artistName;
          if (hit.collectionName) metaAlbumEl.textContent = hit.collectionName;

          if (hit.artworkUrl100) {
            const highResCover = hit.artworkUrl100.replace("100x100bb", "500x500bb");
            setCover(highResCover, false);
            return;
          }
        }
        setCover(CONFIG.defaultCover, true);
      } catch (error) {
        setCover(CONFIG.defaultCover, true);
      }
    }

    function handleNewSong(rawTitle) {
      const title = rawTitle ? rawTitle.trim() : "";
      if (title && title !== currentSong) {
        if (currentSong) {
          addToHistory(currentSong);
        }
        currentSong = title;
        songTitleEl.textContent = title;
        fetchArtworkAndDetails(title);
      } else if (!title && !currentSong) {
        songTitleEl.textContent = "La Radioestación 24/7 - En Vivo";
        metaTrackEl.textContent = "Programación Regular";
        metaArtistEl.textContent = "La Radioestación 24/7";
        metaAlbumEl.textContent = "-";
      }
    }

    // ==========================================
    // METADATOS EN VIVO (ZENO + FASTCAST4U)
    // ==========================================
    function stopMetadataListeners() {
      if (zenoEventSource) {
        zenoEventSource.close();
        zenoEventSource = null;
      }
      if (fastcastTimer) {
        clearInterval(fastcastTimer);
        fastcastTimer = null;
      }
    }

    function startMetadataListener() {
      stopMetadataListeners();
      const stream = CONFIG.streams[activeStreamIndex];

      if (stream.type === "zeno") {
        zenoEventSource = new EventSource(stream.metadataUrl);
        zenoEventSource.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            handleNewSong(data.streamTitle);
            if (data.listeners !== undefined) {
              updateListeners(data.listeners);
            }
          } catch (err) {}
        };
        zenoEventSource.onerror = () => {
          if (zenoEventSource) zenoEventSource.close();
          setTimeout(() => {
            if (activeStreamIndex === 0) startMetadataListener();
          }, 5000);
        };
      } else if (stream.type === "fastcast") {
        const fetchFastcastStats = async () => {
          try {
            const res = await fetch(`${stream.statusUrl}?t=${Date.now()}`);
            const data = await res.json();
            const source = Array.isArray(data.icestats?.source)
              ? data.icestats.source[0]
              : data.icestats?.source;
            const title = source?.title || source?.yp_currently_playing || "";
            handleNewSong(title);

            const details = [];
            if (source?.bitrate) details.push(`${source.bitrate} kbps`);
            if (source?.genre) details.push(source.genre);
            metaQualityEl.textContent = details.length > 0 ? details.join(" • ") : "En vivo";

            if (source && source.listeners !== undefined) {
              updateListeners(source.listeners);
            } else {
              updateListeners(null);
            }
          } catch (err) {
            if (!currentSong) {
              songTitleEl.textContent = "La Radioestación 24/7 - En Vivo";
            }
          }
        };
        fetchFastcastStats();
        fastcastTimer = setInterval(fetchFastcastStats, 12000);
      }
    }

    startMetadataListener();
  </script>
</body>
